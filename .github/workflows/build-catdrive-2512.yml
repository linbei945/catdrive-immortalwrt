name: Build ImmortalWrt 25.12 for CatDrive (小猫盘)

# 只编猫盘（Armada 3720 / 512MB / 8GB eMMC）单系统镜像，
# 产物为 sdcard.img.gz：kernel 分区(ext4) + squashfs rootfs 分区，
# 不含 U-Boot，直接沿用猫盘 SPI 里已有的 U-Boot。

on:
  workflow_dispatch:
    inputs:
      rootfs_size:
        description: "rootfs 分区大小(MB)，默认 1024，剩余空间留给 overlay/数据"
        required: false
        default: "1024"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev file \
            wget libelf-dev device-tree-compiler libpython3-dev \
            python3-pyelftools subversion swig time xsltproc

      - name: Clone ImmortalWrt 25.12
        run: |
          git clone --depth 1 -b openwrt-25.12 \
            https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add CatDrive DTS and device profile
        run: |
          set -e
          DTS_DIR=openwrt/target/linux/mvebu/files/arch/arm64/boot/dts/marvell
          mkdir -p "$DTS_DIR"
          cp dts/armada-3720-catdrive.dts "$DTS_DIR/armada-3720-catdrive.dts"

          # 注册设备：原工程只放了 DTS 却没加设备定义，
          # 实际编译的是 Marvell 官方 DB 开发板(armada-3720-db)的 DTB，
          # 在猫盘上 eMMC/SATA/PHY 全对不上，起不来。
          cat patches/cortexa53-catdrive.mk >> openwrt/target/linux/mvebu/image/cortexa53.mk

          # 自定义 boot.scr：用 ext4load（猫盘精简 U-Boot 没有 load 命令），
          # 并显式带 console=ttyMV0,115200 earlycon=ar3700_uart,0xd0012000
          cp bootscript/catdrive.bootscript \
             openwrt/target/linux/mvebu/image/catdrive.bootscript

          echo "=== 已注册设备 ==="
          grep -n "Device/catdrive" openwrt/target/linux/mvebu/image/cortexa53.mk
          echo "=== bootscript ==="
          grep -n "ext4load\|console=" openwrt/target/linux/mvebu/image/catdrive.bootscript

      - name: Bake bypass-router defaults
        run: |
          set -e
          mkdir -p openwrt/files/etc/uci-defaults
          cat > openwrt/files/etc/uci-defaults/99-catdrive-bypass <<'EOS'
          #!/bin/sh
          # 出厂即配成旁路由：主路由 192.168.5.1，本机 192.168.5.11
          # 同时保留 192.168.1.1 作为备用地址，万一 5.x 网段不可达还能直连抢救
          uci -q delete network.wan
          uci -q delete network.wan6
          uci -q delete network.lan.ipaddr
          uci -q delete network.lan.ip6assign
          uci add_list network.lan.ipaddr='192.168.5.11/24'
          uci add_list network.lan.ipaddr='192.168.1.1/24'
          uci set network.lan.proto='static'
          uci set network.lan.gateway='192.168.5.1'
          uci set network.lan.dns='192.168.5.1'
          uci set network.@device[0].macaddr='4c:65:a8:10:f7:68'
          uci set dhcp.lan.ignore='1'
          uci set dhcp.lan.dhcpv4='disabled'
          uci set dhcp.lan.ra='disabled'
          uci commit network
          uci commit dhcp
          exit 0
          EOS
          chmod +x openwrt/files/etc/uci-defaults/99-catdrive-bypass
          echo "=== 烤入的配置 ==="
          cat openwrt/files/etc/uci-defaults/99-catdrive-bypass

      - name: Configure
        run: |
          set -e
          cd openwrt
          cat > .config <<EOF
          CONFIG_TARGET_mvebu=y
          CONFIG_TARGET_mvebu_cortexa53=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_DEVICE_mvebu_cortexa53_DEVICE_catdrive=y

          # 分区：32MB kernel + 可配置 rootfs，其余留空给 overlay / 数据盘
          CONFIG_TARGET_KERNEL_PARTSIZE=32
          CONFIG_TARGET_ROOTFS_PARTSIZE=${{ github.event.inputs.rootfs_size || '1024' }}
          # 只出 ext4：该 target 的 sdcard 镜像只有 kernel + rootfs 两个分区，
          # 没有独立的 rootfs_data 分区，squashfs 版本无法持久化配置（实测镜像仅 40MB）。
          # CONFIG_TARGET_ROOTFS_SQUASHFS is not set
          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_IMAGES_GZIP=y

          # LuCI + 中文
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-opkg=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y

          # 基础工具 / 存储
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_fdisk=y

          # OpenClash 所需内核模块：原生镜像没编，公共源里也没有（内核哈希不匹配）
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-inet-diag=y

          # 关键：把该平台所有内核模块都编出来（=m，不进镜像）。
          # 这样内核一次成型，以后任何 kmod 都能从本地模块库安装，不必重编。
          CONFIG_ALL_KMODS=y

          # 主题
          CONFIG_PACKAGE_luci-theme-argon=y
          EOF
          make defconfig

          # ---- 把全部内核模块从"只编译"改成"安装进镜像" ----
          # ALL_KMODS 只让它们 =m（编出来但不装）。这里统一翻成 =y，
          # 让所有 kmod 都进 rootfs：8GB eMMC 足够，且所有 kmod 依赖天然满足，
          # 以后装任何插件都不需要再编译或额外软件源。
          echo "=== 转换前 =m 的 kmod 数量 ==="
          grep -c '^CONFIG_PACKAGE_kmod-.*=m$' .config || true
          # 跳过互斥的替代驱动：ath10k-ct / ath10k-ct-smallbuffers 与 ath10k 提供同名 .ko，
          # 同时安装会在 package/install 阶段报 "trying to overwrite ... owned by kmod-ath10k" 而中断
          # （build #5 的实际失败原因）。它们保持 =m，仍会编进 kmods 仓库，日后可单独安装。
          sed -i -E '/^CONFIG_PACKAGE_kmod-ath10k-ct(-smallbuffers)?=/! s/^(CONFIG_PACKAGE_kmod-[A-Za-z0-9_.+-]+)=m$/\1=y/' .config
          echo "=== 保持 =m 的互斥驱动 ==="
          grep -E '^CONFIG_PACKAGE_kmod-ath10k-ct(-smallbuffers)?=' .config || true
          echo "=== 转换后 =y 的 kmod 数量 ==="
          grep -c '^CONFIG_PACKAGE_kmod-.*=y$' .config || true

          # 再跑一次 defconfig 让依赖关系重新解析（缺依赖的会被自动降级）
          make defconfig
          echo "=== defconfig 后最终 =y 的 kmod 数量 ==="
          grep -c '^CONFIG_PACKAGE_kmod-.*=y$' .config || true
          echo "=== ALL_KMODS 是否保留 ==="
          grep '^CONFIG_ALL_KMODS=y' .config || { echo "!! ALL_KMODS 丢失"; exit 1; }

          echo "=== 校验设备是否选中 ==="
          grep -q "CONFIG_TARGET_DEVICE_mvebu_cortexa53_DEVICE_catdrive=y" .config \
            || { echo "!! catdrive 设备未被选中，检查 cortexa53.mk"; exit 1; }
          grep -E "CONFIG_TARGET_(KERNEL|ROOTFS)_PARTSIZE" .config

      - name: Download sources
        run: |
          cd openwrt
          make download -j8 || true

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: Collect images
        run: |
          set -e
          cd openwrt/bin/targets/mvebu/cortexa53
          ls -lh
          echo "=== SHA256 ==="
          sha256sum *catdrive*sdcard.img.gz | tee sha256sums-catdrive.txt
          echo "=== 体积报告 ==="
          ls -lh *catdrive*.img.gz
          echo "rootfs 压缩包:"
          ls -lh *targz-rootfs.tar.gz
          echo "系统内已装包数量（近似）:"
          echo "  见上面 defconfig 后的 kmod =y 计数"

      - name: Make U-Boot flashable image
        id: strip-uboot-image
        run: |
          set -e
          cd openwrt/bin/targets/mvebu/cortexa53
          SRC=$(ls *catdrive*ext4*sdcard.img.gz | head -1)
          OUT=${SRC%.img.gz}-uboot.img.gz
          # OpenWrt 在 gzip 流结束后追加 sysupgrade 元数据（JSON+签名，约 800 字节）。
          # U-Boot 的 gzwrite 从 buffer 末 8 字节读 gzip CRC/ISIZE，会被这段尾巴顶掉，
          # 结果是写满整盘之后才报 crc 错误。这里剥掉尾巴，产出可直接 gzwrite 的文件。
          python3 -c "import sys,zlib;d=open(sys.argv[1],'rb').read();o=zlib.decompressobj(16+zlib.MAX_WBITS);o.decompress(d);t=o.unused_data;open(sys.argv[2],'wb').write(d[:len(d)-len(t)]);print('src=%d tail=%d clean=%d'%(len(d),len(t),len(d)-len(t)))" "$SRC" "$OUT"
          gzip -t "$OUT"
          sha256sum "$OUT" >> sha256sums-catdrive.txt
          cat sha256sums-catdrive.txt

      - name: Collect matching kernel modules
        run: |
          set -e
          cd openwrt/bin/targets/mvebu/cortexa53
          mkdir -p kmods-extra
          n=0
          for pat in 'kmod-tun-*.apk' 'kmod-nft-tproxy-*.apk' 'kmod-inet-diag-*.apk'; do
            for f in $(find . -name "$pat"); do
              cp "$f" kmods-extra/ && n=$((n+1))
            done
          done
          echo "copied=$n"
          echo "=== kmods 目录 ==="
          ls kmods/ 2>/dev/null || echo "(无 kmods 目录)"
          echo "=== kmods-extra ==="
          ls -l kmods-extra/ || true
          [ "$n" -ge 3 ] || { echo "!! 未收集到全部内核模块"; exit 1; }

      - name: Package full kmods repository
        run: |
          set -e
          cd openwrt/bin/targets/mvebu/cortexa53
          ls -d kmods/*/ 2>/dev/null || { echo "!! 没有 kmods 目录，ALL_KMODS 可能未生效"; exit 1; }
          echo "=== 各版本模块数 ==="
          for d in kmods/*/; do echo "$d : $(ls $d/*.apk 2>/dev/null | wc -l) 个"; done
          tar czf kmods-full.tar.gz -C kmods .
          ls -lh kmods-full.tar.gz
          echo "=== 解开后校验 ==="
          tar tzf kmods-full.tar.gz | head -5

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12-catdrive
          path: |
            openwrt/bin/targets/mvebu/cortexa53/*catdrive*
            openwrt/bin/targets/mvebu/cortexa53/sha256sums-catdrive.txt
            openwrt/bin/targets/mvebu/cortexa53/kmods-extra/*.apk
            openwrt/bin/targets/mvebu/cortexa53/kmods-full.tar.gz
          retention-days: 90

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: catdrive-2512-${{ github.run_number }}
          name: ImmortalWrt 25.12 for CatDrive (build ${{ github.run_number }})
          body: |
            猫盘（小猫盘 / Armada 3720 / 512MB / 8GB eMMC）单系统 ImmortalWrt 25.12。

            **刷机请用 `*-sdcard-uboot.img.gz`**（已剥离 sysupgrade 元数据尾巴，
            U-Boot 的 gzwrite 才能校验通过）。`*-sdcard.img.gz` 为原始产物，
            仅用于 sysupgrade、归档，不要直接喂给 gzwrite。

            U-Boot 下：
            ```
            usb start
            fatload usb 0:1 0x6000000 <文件名>-sdcard-uboot.img.gz
            crc32 0x6000000 $filesize
            gzwrite mmc 0 0x6000000 $filesize
            setenv bootcmd 'run bootcmd_mmc0'
            saveenv
            reset
            ```
          files: |
            openwrt/bin/targets/mvebu/cortexa53/*catdrive*sdcard.img.gz
            openwrt/bin/targets/mvebu/cortexa53/*catdrive*sdcard-uboot.img.gz
            openwrt/bin/targets/mvebu/cortexa53/sha256sums-catdrive.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
