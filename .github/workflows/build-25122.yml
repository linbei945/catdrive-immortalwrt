name: Build ImmortalWrt 25.12.2 for CatDrive (Plan B)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'catdrive-25122/**'
      - '.github/workflows/build-25122.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout catdrive repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --force
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev \
            file wget libelf-dev

      - name: Checkout ImmortalWrt v25.12.2
        run: git clone --depth 1 --branch v25.12.2 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: Apply catdrive integration
        run: |
          mkdir -p openwrt/target/linux/mvebu/files/arch/arm64/boot/dts/marvell
          cp catdrive-25122/dts/armada-3720-catdrive.dts \
            openwrt/target/linux/mvebu/files/arch/arm64/boot/dts/marvell/
          cp catdrive-25122/catdrive.bootscript openwrt/target/linux/mvebu/image/
          cat catdrive-25122/cortexa53-catdrive.append.mk >> openwrt/target/linux/mvebu/image/cortexa53.mk
          mkdir -p openwrt/files
          cp -a catdrive-25122/files/. openwrt/files/
          cp catdrive-25122/official.buildinfo openwrt/.config
          printf 'CONFIG_PACKAGE_ucode=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_ucode-mod-fs=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_ucode-mod-uci=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_ucode-mod-ubus=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_ucode-mod-math=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_ucode-mod-html=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_luci=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_dropbear=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_uhttpd=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_rpcd=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_luci-app-samba4=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_ip-full=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_conntrack=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_odhcp6c=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_odhcpd-ipv6only=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_ddns-scripts=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_luci-app-ddns=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_luci-app-wol=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_etherwake=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_nlbwmon=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_luci-app-nlbwmon=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_samba4-server=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_vsftpd=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_ntfs-3g=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_cifsmount=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_smartmontools=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_hdparm=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_lm-sensors=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_lsblk=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_partx-utils=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_resize2fs=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_dosfstools=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_mkf2fs=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_btrfs-progs=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_uboot-envtools=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_block-mount=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_e2fsprogs=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_fdisk=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_kmod-hwmon-gpiofan=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_kmod-usb-storage-uas=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_bash=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_curl=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_coreutils=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_coreutils-base64=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_coreutils-nohup=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_coreutils-sha1sum=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_coreutils-stat=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_coreutils-tac=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_vim-full=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_less=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_tree=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_file=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_screen=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_bc=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_pv=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_lsof=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_strace=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_inotifywait=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_tcpdump=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_iperf3=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_httping=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_iftop=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_bind-dig=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_openssl-util=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_ca-certificates=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_ca-bundle=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_unrar=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_unzip=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_xz=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_bzip2=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_i2c-tools=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_usbutils=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_rng-tools=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_zoneinfo-asia=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_git=y\n' >> openwrt/.config
          printf 'CONFIG_PACKAGE_git-http=y\n' >> openwrt/.config
          printf 'CONFIG_TARGET_DEVICE_mvebu_cortexa53_DEVICE_catdrive=y\n' >> openwrt/.config
          printf 'CONFIG_TARGET_DEVICE_PACKAGES_mvebu_cortexa53_DEVICE_catdrive=""\n' >> openwrt/.config

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          git -C feeds/luci checkout d6167ea0 > /dev/null 2>&1
          git -C feeds/packages checkout 84bd863 > /dev/null 2>&1
          ./scripts/feeds install -a
          ./scripts/feeds install luci-app-samba4 luci-app-nlbwmon luci-app-wol luci-app-ddns lm-sensors unrar

      - name: Normalize config and assert key settings
        run: |
          cd openwrt
          make defconfig
          echo "--- key config check ---"
          grep -E '^CONFIG_(TARGET_ROOTFS_PARTSIZE|ALL_KMODS|PACKAGE_uboot-envtools|PACKAGE_luci|PACKAGE_block-mount)=' .config
          grep -q '^CONFIG_ALL_KMODS=y' .config || { echo 'FAIL: ALL_KMODS not enabled'; exit 1; }
          grep -q '^CONFIG_TARGET_ROOTFS_PARTSIZE=2048' .config || { echo 'FAIL: wrong PARTSIZE'; exit 1; }
          grep -q '^CONFIG_PACKAGE_uboot-envtools=y' .config || { echo 'FAIL: uboot-envtools missing'; exit 1; }
          grep -q '^CONFIG_TARGET_DEVICE_mvebu_cortexa53_DEVICE_catdrive=y' .config || { echo 'FAIL: catdrive device not selected'; exit 1; }
          grep -q '^CONFIG_PACKAGE_dropbear=y' .config || { echo 'FAIL: dropbear missing'; exit 1; }
          grep -q '^CONFIG_PACKAGE_luci=y' .config || { echo 'FAIL: luci missing'; exit 1; }
          grep -q '^CONFIG_PACKAGE_samba4-server=y' .config || { echo 'FAIL: samba4 missing'; exit 1; }
          grep -q '^CONFIG_PACKAGE_lm-sensors=y' .config || { echo 'FAIL: lm-sensors missing'; exit 1; }
          true || { echo 'FAIL: material theme missing'; exit 1; }
          grep -q '^CONFIG_PACKAGE_samba4-server=y' .config || { echo 'FAIL: samba4 missing'; exit 1; }
          grep -q '^CONFIG_PACKAGE_odhcp6c=y' .config || { echo 'FAIL: odhcp6c (IPv6) missing'; exit 1; }
          grep -q '^CONFIG_PACKAGE_bash=y' .config || { echo 'FAIL: bash missing'; exit 1; }
          grep -q '^CONFIG_PACKAGE_curl=y' .config || { echo 'FAIL: curl missing'; exit 1; }
          echo "--- key config OK ---"

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc)
          # retry once for flaky mirrors
          make download -j1

      - name: Build
        run: |
          cd openwrt
          if ! make -j$(nproc) > build.log 2>&1; then
            echo '=== BUILD FAILED ==='
            tail -n 200 build.log
            exit 1
          fi
          echo '=== BUILD OK ==='
          ls -lh bin/targets/mvebu/cortexa53/

      - name: Check kernel vermagic against official kmods
        run: |
          cd openwrt
          VER=$(cat build_dir/target-*/linux-mvebu_cortexa53/linux-*/.vermagic 2>/dev/null | head -n 1)
          echo "kernel vermagic: $VER"
          echo "$VER" | grep -q '846049ff0684ff21c8cae8e6f2efc82e' \
            || { echo 'FAIL: vermagic differs from official 25.12.2 kmods (846049ff...)'; exit 1; }
          echo '=== VERMAGIC OK: official kmods are installable ==='

      - name: Strip sysupgrade trailer
        run: |
          cd openwrt/bin/targets/mvebu/cortexa53
          python3 "$GITHUB_WORKSPACE/catdrive-25122/strip_trailer.py"

      - name: Verify image
        run: |
          cd openwrt/bin/targets/mvebu/cortexa53
          ls -lh *catdrive*
          IMG=$(ls *catdrive*ext4-sdcard*.img.gz | head -n 1)
          test -f "$IMG" || { echo 'FAIL: ext4-sdcard image not found'; exit 1; }
          rc=0
          gzip -t "$IMG" 2>/dev/null || rc=$?
          [ "$rc" -eq 0 ] || { echo "FAIL: gzip check rc=$rc (trailer still present?)"; exit 1; }
          echo "=== IMAGE OK: $IMG ==="
          sha256sum "$IMG"

      - name: Collect artifacts
        run: |
          cd openwrt/bin/targets/mvebu/cortexa53
          mkdir -p /tmp/out
          cp *catdrive*ext4-sdcard*.img.gz /tmp/out/
          cp *catdrive*squashfs-sdcard*.img.gz /tmp/out/ 2>/dev/null || true
          cp *catdrive*initramfs-kernel*.bin /tmp/out/ 2>/dev/null || true
          cp sha256sums /tmp/out/ 2>/dev/null || true
          ls -lh /tmp/out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: catdrive-25122-image
          path: /tmp/out/
          retention-days: 30

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: catdrive-25122
          name: CatDrive ImmortalWrt 25.12.2 (Plan B)
          files: /tmp/out/*
          overwrite_files: true
